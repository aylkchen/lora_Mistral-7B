base_model: mistralai/Mistral-7B-Instruct-v0.1
task_name: faq_support_lora_r8
dataset_path: data/faq/splits
output_dir: outputs/faq_mistral_lora_r8
load_in_4bit: true
batch_size: 4
gradient_accumulation_steps: 4
epochs: 3
learning_rate: 2.0e-4
max_seq_length: 512
seed: 42
logging_steps: 20
save_steps: 200
save_total_limit: 2
gradient_checkpointing: true
report_to: none
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
generation:
  max_new_tokens: 96
  temperature: 0.3
  top_p: 0.9
  repetition_penalty: 1.05
  do_sample: true
evaluation:
  mode: faq
  prompt_path: data/faq/heldout.jsonl
  manual_score_path: outputs/faq_mistral_lora_r8/eval_outputs/faq_manual_sheet.jsonl
  sample_size: 100
